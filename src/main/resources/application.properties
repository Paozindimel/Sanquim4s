spring.application.name=colegio-sanquim-api
server.port=${PORT:8080}

# ===================================================================
# CONEXÃO COM SUPABASE (POSTGRESQL) OU POSTGRES LOCAL
# Basta configurar DB_URL, DB_USERNAME e DB_PASSWORD nas variáveis
# de ambiente (IDE / Render / Railway) ou trocar o valor padrão abaixo
# ===================================================================
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/sanquim}
spring.datasource.username=${DB_USERNAME:postgres}
spring.datasource.password=${DB_PASSWORD:postgres}

spring.datasource.hikari.maximum-pool-size=5
spring.datasource.hikari.minimum-idle=1
spring.datasource.hikari.connection-timeout=30000

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.format_sql=true

api.security.jwt.secret=${JWT_SECRET}api.security.jwt.expiration-ms=${JWT_EXPIRATION_MS:28800000}

springdoc.api-docs.path=/v3/api-docs
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.swagger-ui.operationsSorter=method
springdoc.swagger-ui.tagsSorter=alpha
